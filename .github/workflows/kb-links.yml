name: KB link check
on:
  schedule: [{ cron: "0 13 * * 1" }]   # every Monday
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: run
        run: |
          node scripts/check_links.js | tee report.txt
        continue-on-error: true
      - name: Open issue if links are dead
        if: steps.run.outcome == 'failure'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh issue create --title "KB source link(s) may be dead" --label kb-feedback --body-file report.txt
